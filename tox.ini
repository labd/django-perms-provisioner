[tox]
envlist =
    py311-django{32,40,41}
    py{311,312,313}-django42
    py{311,312,313,314}-django52

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
commands =
    coverage run --source django_perms_provisioner -m pytest {posargs}
    coverage report
deps =
    django32: Django>=3.2,<3.3
    django40: Django>=4.0,<4.1
    django41: Django>=4.1,<4.2
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
extras = test

[testenv:format]
deps = ruff
skip_install = true
commands =
    ruff format --check src tests
    ruff check src tests
