[project]
name = "django-perms-provisioner"
version = "0.0.6"
description = "Provision django instances with usergroups and permissions"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lab Digital", email = "opensource@labdigital.nl" }]
requires-python = ">=3.11"
dependencies = [
    "Cerberus>=1.3.2,<2",
    "Django>=5.2",
    "PyYAML>=5.3.1,<7",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/labd/django-perms-provisioner"
Changelog = "https://github.com/labd/django-perms-provisioner/blob/master/CHANGES"

[dependency-groups]
dev = [
    "coverage[toml]>=7",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.11",
    "ruff>=0.17",
    "tox>=4.26",
    "tox-uv>=1.28",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# supply-chain: only resolve releases at least 14 days old; use
# exclude-newer-package for urgent security fixes
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Locked versions newer than the 14-day cutoff; remove after 2026-11-09
filelock = "2026-10-27T00:00:00Z"  # 4.2.4 fixes GHSA-2g95-wg33-c5x2 GHSA-567q-5qvw-pf92 GHSA-9vhv-jxww-xfm5 ...
uv = "2026-10-27T00:00:00Z"  # 0.13.5 fixes GHSA-hq85-5cpj-mr62
virtualenv = "2026-10-27T00:00:00Z"  # 21.14.13 fixes GHSA-394h-qwmc-48pf GHSA-43mp-35q3-x3fq GHSA-494p-63j8-28p3 ...

[tool.hatch.build.targets.wheel]
packages = ["src/django_perms_provisioner"]

[tool.hatch.build.targets.sdist]
include = [
    "src/django_perms_provisioner",
    "tests",
    "CHANGES",
    "LICENSE",
    "README.rst",
]

[tool.pytest.ini_options]
minversion = "8.0"
strict = true
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["django_perms_provisioner"]

[tool.coverage.paths]
source = [
    "src/django_perms_provisioner",
    ".tox/*/lib/python*/site-packages/django_perms_provisioner",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
