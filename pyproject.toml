[project]
name = "django-perms-provisioner"
version = "0.0.6"
description = "Provision django instances with usergroups and permissions"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lab Digital", email = "opensource@labdigital.nl" }]
requires-python = ">=3.11"
dependencies = [
    "Cerberus>=1.3.2,<2",
    "Django>=4.1",
    "PyYAML>=5.3.1,<7",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/labd/django-perms-provisioner"
Changelog = "https://github.com/labd/django-perms-provisioner/blob/master/CHANGES"

[dependency-groups]
dev = [
    "coverage[toml]>=7",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.11",
    "ruff>=0.17",
    "tox>=4.26",
    "tox-uv>=1.28",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_perms_provisioner"]

[tool.hatch.build.targets.sdist]
include = [
    "src/django_perms_provisioner",
    "tests",
    "CHANGES",
    "LICENSE",
    "README.rst",
]

[tool.pytest.ini_options]
minversion = "8.0"
strict = true
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["django_perms_provisioner"]

[tool.coverage.paths]
source = [
    "src/django_perms_provisioner",
    ".tox/*/lib/python*/site-packages/django_perms_provisioner",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
